name: AHMP Reference CI

on:
  push:
  pull_request:

jobs:
  typescript-reference:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: examples/typescript
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: examples/typescript/package.json
      - run: npm install
      - run: npm test
      - run: npm run demo
